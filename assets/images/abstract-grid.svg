<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Abstract tech grid background">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#2ee9a6" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.5" fill="#ffffff" fill-opacity=".12"/>
    </pattern>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#grid)"/>

  <g filter="url(#blur)">
    <circle cx="250" cy="160" r="160" fill="url(#a)" opacity=".85"/>
    <circle cx="860" cy="210" r="180" fill="#2ee9a6" opacity=".15"/>
    <circle cx="660" cy="470" r="220" fill="#7c5cff" opacity=".16"/>
  </g>
</svg>
